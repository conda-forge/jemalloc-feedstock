schema_version: 1

context:
  name: jemalloc
  version: "5.4.0"

recipe:
  name: ${{ name }}-split
  version: ${{ version }}

source:
  url: https://github.com/jemalloc/jemalloc/releases/download/${{ version }}/jemalloc-${{ version }}.tar.bz2
  sha256: 200776fac271093e7c2f21edd6d62657ecd2be578d9328633f2a86bfa6ef4f1d
  patches:
    - export-mangled-syms.patch

build:
  number: 1
  skip: win

outputs:
  - package:
      name: libjemalloc
    build:
      script:
        file: build-jemalloc.sh
    requirements:
      build:
        - make
        - if: unix
          then: gnuconfig
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
      run_exports:
        - ${{ pin_subpackage('libjemalloc', upper_bound=None) }}
    tests:
      - script:
          - if: linux
            then: test -f $PREFIX/lib/libjemalloc.so.2
          - test ! -f $PREFIX/lib/libjemalloc.a
          - test ! -f $PREFIX/lib/libjemalloc_pic.a
          - test ! -f $PREFIX/bin/jeprof
          - if: osx
            then: test -f $PREFIX/lib/libjemalloc.2.dylib
          - test -f $PREFIX/include/jemalloc/jemalloc.h
  - package:
      name: ${{ name }}
    build:
      script:
        file: build-jemalloc.sh
    requirements:
      build:
        - make
        - if: unix
          then: gnuconfig
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
        - ${{ pin_subpackage('libjemalloc', exact=true) }}
      run:
        - ${{ pin_subpackage('libjemalloc', exact=true) }}
      run_exports:
        - ${{ pin_subpackage('libjemalloc', upper_bound=None) }}
    tests:
      - files:
          recipe:
            - test.c
        requirements:
          run:
            - ${{ compiler('c') }}
        script:
          - test -f $PREFIX/bin/jeprof
          - $CC -I$PREFIX/include -L$PREFIX/lib -ljemalloc test.c
  - package:
      name: lib${{ name }}-local
    build:
      script:
        file: build-jemalloc-local.sh
    requirements:
      build:
        - make
        - if: unix
          then: gnuconfig
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
      run_exports:
        - ${{ pin_subpackage("libjemalloc-local", upper_bound=None) }}
    tests:
      - script:
          - if: linux
            then: test -f $PREFIX/lib/libjemalloclocal.so.2
          - test ! -f $PREFIX/lib/libjemalloc${SHLIB_EXT}
          - test ! -f $PREFIX/lib/libjemalloclocal.a
          - test ! -f $PREFIX/lib/libjemalloclocal_pic.a
          - if: osx
            then: test -f $PREFIX/lib/libjemalloclocal.2.dylib
          - test -f $PREFIX/include/jemalloc/jemalloclocal.h
          - test ! -f $PREFIX/jeprof
  - package:
      name: ${{ name }}-local
    build:
      script:
        file: build-jemalloc-local.sh
    requirements:
      build:
        - make
        - if: unix
          then: gnuconfig
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
        - ${{ pin_subpackage('libjemalloc-local', exact=true) }}
      run:
        - ${{ pin_subpackage('libjemalloc-local', exact=true) }}
      run_exports:
        - ${{ pin_subpackage("libjemalloc-local", upper_bound=None) }}
      run_constraints:
        - jemalloc <0a0
    tests:
      - files:
          recipe:
            - test-local.c
        requirements:
          run:
            - ${{ compiler('c') }}
        script:
          - test -f $PREFIX/bin/jeprof
          - $CC -I$PREFIX/include -L$PREFIX/lib -ljemalloclocal test-local.c

about:
  license: BSD-2-Clause
  license_file: COPYING
  summary: general purpose malloc(3) implementation
  homepage: http://jemalloc.net
  repository: https://github.com/jemalloc/jemalloc

extra:
  feedstock-name: jemalloc
  recipe-maintainers:
    - wesm
    - xhochy
    - matthiasdiener
